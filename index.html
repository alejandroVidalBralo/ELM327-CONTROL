<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 ShiftLight & ELM327 BLE Control</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090c10;
      --panel-bg: #0d1117;
      --border: #21262d;
      --text: #c9d1d9;
      --muted: #8b949e;
      
      --cyan: #38bdf8;
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
      --purple: #bc8cff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      font-weight: 600;
      color: #f0f6fc;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 12px;
      background: #161b22;
      border: 1px solid var(--border);
      font-size: 0.78rem;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--red);
    }

    .status-pill.connected .dot { background-color: var(--green); box-shadow: 0 0 6px var(--green); }
    .status-pill.connecting .dot { background-color: var(--yellow); }

    .actions { display: flex; gap: 8px; }

    button {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: #30363d; }
    button.primary { background: #1f6feb; color: #fff; border-color: #1f6feb; }
    button.primary:hover { background: #388bfd; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Layout */
    main {
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    .card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .card-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    /* Grid for Modes */
    .mode-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .mode-btn {
      padding: 10px;
      text-align: center;
      background: #161b22;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .mode-btn:hover {
      border-color: var(--cyan);
      color: #fff;
    }

    .mode-btn.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--cyan);
      color: var(--cyan);
      font-weight: 600;
    }

    /* Controls Row */
    .controls-row {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .control-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
    }

    input[type="color"] {
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
    }

    input[type="range"] {
      accent-color: var(--cyan);
      cursor: pointer;
    }

    /* Live RPM Header Display */
    .rpm-display-box {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .rpm-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--cyan);
    }

    /* Terminal Console */
    .terminal-container {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      height: 340px;
      overflow: hidden;
    }

    .console-header {
      padding: 8px 12px;
      background: #161b22;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .console {
      flex: 1;
      padding: 10px 12px;
      background: var(--bg);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .line { line-height: 1.35; word-break: break-all; }
    .time { color: var(--muted); font-size: 0.72rem; margin-right: 6px; }
    .sys { color: var(--yellow); }
    .rx { color: var(--green); }
    .tx { color: var(--cyan); }
    .err { color: var(--red); }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header>
    <div class="brand">
      <h1>ESP32 ShiftLight BLE Control</h1>
    </div>

    <div class="actions">
      <div class="status-pill" id="statusPill">
        <div class="dot"></div>
        <span id="statusText">Desconectado</span>
      </div>
      <button id="btnConnect" class="primary">Conectar ESP32 BLE</button>
    </div>
  </header>

  <main>

    <!-- RPM & Status Card -->
    <div class="card" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
      <div>
        <div class="card-title" style="margin: 0;">Motor Opel Corsa Diesel</div>
        <div style="font-size: 0.8rem; color: var(--muted); margin-top: 2px;">83 LEDs WS2812B (GPIO 33) • 60 FPS</div>
      </div>
      <div class="rpm-display-box">
        <span class="rpm-val" id="valRpm">0</span>
        <span style="font-size: 0.85rem; color: var(--muted); font-weight: 600;">RPM</span>
      </div>
    </div>

    <!-- Mode Selector Card -->
    <div class="card">
      <div class="card-title">Modos de Iluminación</div>

      <div class="mode-grid">
        <button class="mode-btn active" data-mode="1">🚗 Tacómetro RPM</button>
        <button class="mode-btn" data-mode="2">🎨 Color Fijo</button>
        <button class="mode-btn" data-mode="3">🌈 Arcoíris</button>
        <button class="mode-btn" data-mode="4">💨 Respiración</button>
        <button class="mode-btn" data-mode="5">🚨 Estroboscópico</button>
        <button class="mode-btn" data-mode="0">🎬 Bienvenida</button>
        <button class="mode-btn" data-mode="6">❌ Apagado</button>
      </div>

      <div class="controls-row">
        <div class="control-item">
          <span>Color:</span>
          <input type="color" id="pickerColor" value="#0096ff">
        </div>

        <div class="control-item">
          <span>Brillo:</span>
          <input type="range" id="sliderBright" min="5" max="255" value="60">
          <span id="valBright" style="font-family: monospace; font-size: 0.8rem;">60</span>
        </div>
      </div>
    </div>

    <!-- Minimal Terminal Console -->
    <div class="terminal-container">
      <div class="console-header">
        <span>BLE DATA LOG</span>
        <button id="btnClear" style="padding: 2px 8px; font-size: 0.7rem;">Limpiar</button>
      </div>
      <div class="console" id="console">
        <div class="line sys"><span class="time">[00:00:00]</span> [SYS] Conecte mediante Web Bluetooth al ESP32_OBD_ShiftLight.</div>
      </div>
    </div>

  </main>

  <script>
    let esp32Device = null;
    let modeChar = null, colorChar = null, brightChar = null, rpmChar = null;
    let isConnected = false;

    const ESP32_SERVICE_UUID = "a21b3690-d98e-11ec-9d64-0242ac120002";
    const CHAR_MODE    = "a21b3a32-d98e-11ec-9d64-0242ac120002";
    const CHAR_COLOR   = "a21b3c00-d98e-11ec-9d64-0242ac120002";
    const CHAR_BRIGHT  = "a21b3d00-d98e-11ec-9d64-0242ac120002";
    const CHAR_RPM     = "a21b3e00-d98e-11ec-9d64-0242ac120002";

    const statusPill = document.getElementById('statusPill');
    const statusText = document.getElementById('statusText');
    const btnConnect = document.getElementById('btnConnect');
    const consoleEl = document.getElementById('console');

    // Connect to ESP32 BLE Server
    btnConnect.addEventListener('click', async () => {
      if (isConnected) {
        disconnectBLE();
        return;
      }

      try {
        if (!navigator.bluetooth) {
          log("Web Bluetooth no disponible.", "err");
          alert("Usa Google Chrome o Microsoft Edge.");
          return;
        }

        updateStatus("connecting", "Buscando...");
        log("Escaneando dispositivos ESP32...", "sys");

        esp32Device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'ESP32_OBD_ShiftLight' }],
          optionalServices: [ESP32_SERVICE_UUID]
        });

        esp32Device.addEventListener('gattserverdisconnected', onDisconnected);
        updateStatus("connecting", "Conectando GATT...");

        const server = await esp32Device.gatt.connect();
        const service = await server.getPrimaryService(ESP32_SERVICE_UUID);

        modeChar = await service.getCharacteristic(CHAR_MODE);
        colorChar = await service.getCharacteristic(CHAR_COLOR);
        brightChar = await service.getCharacteristic(CHAR_BRIGHT);

        try {
          rpmChar = await service.getCharacteristic(CHAR_RPM);
          await rpmChar.startNotifications();
          rpmChar.addEventListener('characteristicvaluechanged', (e) => {
            const data = new DataView(e.target.value.buffer);
            if (data.byteLength >= 2) {
              const rpm = data.getUint16(0, false);
              document.getElementById('valRpm').innerText = rpm;
            }
          });
        } catch(err) {}

        isConnected = true;
        btnConnect.innerText = "Desconectar";
        btnConnect.classList.replace('primary', '');
        updateStatus("connected", "Conectado");
        log("Conectado con éxito al ESP32.", "sys");

      } catch (err) {
        log("Error de conexión: " + err.message, "err");
        updateStatus("disconnected", "Desconectado");
      }
    });

    function disconnectBLE() {
      if (esp32Device && esp32Device.gatt.connected) {
        esp32Device.gatt.disconnect();
      }
      onDisconnected();
    }

    function onDisconnected() {
      isConnected = false;
      updateStatus("disconnected", "Desconectado");
      btnConnect.innerText = "Conectar ESP32 BLE";
      btnConnect.classList.add('primary');
      log("ESP32 Desconectado.", "sys");
    }

    function updateStatus(state, text) {
      statusPill.className = "status-pill " + state;
      statusText.innerText = text;
    }

    // Mode Selector Buttons
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const modeVal = parseInt(btn.dataset.mode, 10);
        if (modeChar && isConnected) {
          await modeChar.writeValue(new Uint8Array([modeVal]));
          log(`Modo enviado: ${btn.innerText}`, "tx");
        }
      });
    });

    // Color Picker
    document.getElementById('pickerColor').addEventListener('change', async (e) => {
      const hex = e.target.value;
      const r = parseInt(hex.substr(1,2), 16);
      const g = parseInt(hex.substr(3,2), 16);
      const b = parseInt(hex.substr(5,2), 16);

      if (colorChar && isConnected) {
        await colorChar.writeValue(new Uint8Array([r, g, b]));
        log(`Color enviado: RGB(${r},${g},${b})`, "tx");
      }
    });

    // Brightness Slider
    document.getElementById('sliderBright').addEventListener('input', async (e) => {
      const val = parseInt(e.target.value, 10);
      document.getElementById('valBright').innerText = val;

      if (brightChar && isConnected) {
        await brightChar.writeValue(new Uint8Array([val]));
      }
    });

    function log(msg, type = "sys") {
      const timeStr = new Date().toLocaleTimeString();
      const line = document.createElement('div');
      line.className = `line ${type}`;
      line.innerHTML = `<span class="time">[${timeStr}]</span> ${msg}`;
      consoleEl.appendChild(line);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    document.getElementById('btnClear').addEventListener('click', () => {
      consoleEl.innerHTML = "";
    });
  </script>
</body>
</html>
